name: Release

# The MANUAL route. `release-please.yml` is the usual one: it derives the version from
# conventional commits, writes the changelog and publishes when its PR merges. This
# exists for a release cut by hand.
#
# Fires when a GitHub Release is PUBLISHED (not on a draft), so a draft can be written
# and reviewed without shipping anything. Releases created by release-please use
# `GITHUB_TOKEN` and do not fire this, so nothing publishes twice.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.target.outputs.version }}
    steps:
      # A publish cannot be taken back, so a malformed tag is rejected before any work
      # starts. A manual dispatch has no tag: it publishes package.json's version.
      - name: Resolve the version from the tag
        id: target
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag ${TAG} is not a semver version (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
