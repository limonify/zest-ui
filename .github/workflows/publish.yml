name: Publish

# The single publish path, called by both release routes: `release-please.yml` when
# its release PR merges, and `release.yml` when a Release is cut by hand.
on:
  workflow_call:
    inputs:
      # The manual route's version (the tag without its `v`), written into package.json
      # before publishing and committed back to main once the publish succeeds. Empty
      # for the release-please route, which bumps the version in its release PR.
      version:
        description: Version to publish and then record back into package.json.
        required: false
        type: string
        default: ''

permissions:
  contents: write # commit the version bump back to main
  id-token: write # npm provenance
  packages: write # push @limonify/zest-ui to GitHub Packages

jobs:
  publish:
    name: Publish @limonify/zest-ui to npm + GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the version-bump commit can push to main after a tag release.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node (npm auth)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Write the tagged version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        # Do not use `npm version` here: npm walks the bun workspace and dies on
        # `workspace:*` (EUNSUPPORTEDPROTOCOL). Just rewrite the version field.
        run: node .github/scripts/write-version.cjs "$VERSION"

      # Both registries reject a publish whose version already exists. Fail early,
      # before any version is recorded, when it is equal to or lower than the latest
      # version on npm.
      - name: Guard against re-publishing an existing version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/zest-ui/package.json').version")"

          LATEST="$(npm view @limonify/zest-ui version 2>/dev/null || true)"
          if [ -z "${LATEST}" ]; then
            echo "No published version on npm yet — will publish ${VERSION}"
            exit 0
          fi

          if [ "${VERSION}" = "${LATEST}" ]; then
            echo "::error::Release ${VERSION} is already published on npm (latest: ${LATEST}); refusing to publish."
            exit 1
          fi

          LOWER="$(printf '%s\n%s\n' "${VERSION}" "${LATEST}" | sort -V | head -n1)"
          if [ "${LOWER}" = "${VERSION}" ]; then
            echo "::error::Release ${VERSION} is older than the latest published version (${LATEST}); refusing to publish."
            exit 1
          fi

          echo "Publishing ${VERSION} (latest published: ${LATEST})"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck · lint · test · build)
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bun run build

      - name: Publish to npm
        working-directory: packages/zest-ui
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirrors @limonify/zest-ui to npm.pkg.github.com under the limonify org.
      # Configure a scoped npmrc for the GitHub Packages registry (this overwrites the
      # npmjs one, which is fine: the npm publish above is already done). The
      # `@limonify` scope mapping makes a plain `npm publish` target
      # npm.pkg.github.com. GitHub Packages does not support npm provenance.
      - name: Set up Node (GitHub Packages auth)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@limonify'

      - name: Publish to GitHub Packages
        working-directory: packages/zest-ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only reached if both publishes succeeded, so main only ever records a version
      # that actually went out. `chore` is not a releasable type, so release-please
      # does not turn this commit into another bump.
      - name: Record the released version on main
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git fetch origin main
          git checkout -B main origin/main
          node .github/scripts/write-version.cjs "$VERSION"
          git add package.json packages/zest-ui/package.json .release-please-manifest.json
          if git diff --staged --quiet; then
            echo "main already at $VERSION — nothing to commit"
            exit 0
          fi
          git commit -m "chore: release v${VERSION}"
          git push origin main
